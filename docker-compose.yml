version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sikap-kemenag-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      - "8080:8080"
    environment:
      - PORT
      - INFISICAL_API_URL
      - INFISICAL_CLIENT_ID
      - INFISICAL_CLIENT_SECRET
      - INFISICAL_PROJECT_ID
      - INFISICAL_ENV
      - INFISICAL_SECRET_PATH
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
